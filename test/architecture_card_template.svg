<svg width="700" height="700" viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="700" height="700" fill="white"/>

<text x="320" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">{{model_name}} ({{param_count}})</text>

<rect x="170" y="86" width="300" height="480" rx="20" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<rect x="190" y="192" width="260" height="312" rx="16" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>

<!-- repeat badge, bottom-left of blue wrapper -->
<rect x="140" y="470" width="72" height="22" rx="11" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
<text x="176" y="481" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#185fa5">&#8635; &#215; {{n_layers}}</text>

<!-- linear output layer -->
<line x1="320" y1="100" x2="320" y2="88" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
<rect x="205" y="100" width="230" height="30" rx="8" fill="#fcfcfb" stroke="#c9c8c3" stroke-width="0.5"/>
<text x="320" y="115" text-anchor="middle" dominant-baseline="central" font-size="14">linear output layer</text>
<line x1="320" y1="146" x2="320" y2="130" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>

<!-- final norm -->
<rect x="205" y="146" width="230" height="30" rx="8" fill="#fcfcfb" stroke="#c9c8c3" stroke-width="0.5"/>
<text x="320" y="161" text-anchor="middle" dominant-baseline="central" font-size="14">final norm</text>
<line x1="320" y1="202" x2="320" y2="176" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>

<!-- C1 residual add: sits right after the blue wrapper opens, combines feed-forward output with resid1 -->
<circle cx="320" cy="211" r="9" fill="#fcfcfb" stroke="#c9c8c3"/>
<text x="320" y="212" text-anchor="middle" dominant-baseline="central" font-size="12">+</text>
<line x1="320" y1="236" x2="320" y2="220" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>

<!-- feed forward -->
<rect x="225" y="236" width="190" height="44" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="320" y="252" text-anchor="middle" dominant-baseline="central" font-size="14">feed forward</text>
<text x="320" y="268" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5f5e5a">variant: swiglu / gelu / moe</text>
<line x1="320" y1="296" x2="320" y2="280" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>

<!-- norm 2 -->
<rect x="225" y="296" width="190" height="28" rx="6" fill="#fcfcfb" stroke="#c9c8c3" stroke-width="0.5"/>
<text x="320" y="310" text-anchor="middle" dominant-baseline="central" font-size="14">norm 2</text>
<line x1="320" y1="340" x2="320" y2="324" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>

<!-- C2 residual add: combines attention output with the pre-block input -->
<circle cx="320" cy="349" r="9" fill="#fcfcfb" stroke="#c9c8c3"/>
<text x="320" y="350" text-anchor="middle" dominant-baseline="central" font-size="12">+</text>
<line x1="320" y1="380" x2="320" y2="358" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>

<!-- attention -->
<rect x="225" y="380" width="190" height="64" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="320" y="399" text-anchor="middle" dominant-baseline="central" font-size="14">attention</text>
<text x="320" y="416" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0f6e56">variant: mha / gqa / sliding</text>
<text x="320" y="431" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0f6e56">{{n_heads}} heads / {{n_kv_heads}} kv</text>
<line x1="320" y1="466" x2="320" y2="444" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>

<!-- norm 1 -->
<rect x="225" y="466" width="190" height="28" rx="6" fill="#fcfcfb" stroke="#c9c8c3" stroke-width="0.5"/>
<text x="320" y="480" text-anchor="middle" dominant-baseline="central" font-size="14">norm 1</text>
<line x1="320" y1="520" x2="320" y2="494" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>

<!-- residual skip paths -->
<path d="M320 510 L430 510 L430 349 L329 349" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M320 335 L430 335 L430 211 L329 211" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- token embedding -->
<rect x="205" y="520" width="230" height="32" rx="8" fill="#fcfcfb" stroke="#c9c8c3" stroke-width="0.5"/>
<text x="320" y="536" text-anchor="middle" dominant-baseline="central" font-size="14">token embedding</text>
<line x1="320" y1="582" x2="320" y2="552" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>

<!-- tokenized text -->
<rect x="205" y="582" width="230" height="30" rx="8" fill="#fcfcfb" stroke="#c9c8c3" stroke-width="0.5"/>
<text x="320" y="597" text-anchor="middle" dominant-baseline="central" font-size="14">tokenized text</text>
<text x="320" y="632" text-anchor="middle" font-size="11" fill="#5f5e5a">sample input text</text>

<!-- right lane: vocab size -->
<line x1="435" y1="115" x2="485" y2="115" stroke="#898781" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="495" y="109" font-size="11" fill="#5f5e5a">vocab size</text>
<text x="495" y="125" font-size="13" font-weight="600" fill="#0b0b0b">{{n_vocab}}</text>

<!-- right lane: feed forward detail panel -->
<line x1="415" y1="258" x2="485" y2="258" stroke="#898781" stroke-width="0.5" stroke-dasharray="4 3"/>
<rect x="485" y="230" width="190" height="150" rx="12" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
<text x="499" y="249" font-size="13" font-weight="600" fill="#712b13">feed forward detail</text>
<text x="499" y="265" font-size="11" fill="#993c1d">hidden dim: {{n_ff}}</text>

<rect x="499" y="276" width="77" height="26" rx="6" fill="#fdf6f3" stroke="#993c1d" stroke-width="0.5"/>
<text x="537" y="289" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993c1d">gate_proj</text>
<rect x="584" y="276" width="77" height="26" rx="6" fill="#fdf6f3" stroke="#993c1d" stroke-width="0.5"/>
<text x="622" y="289" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993c1d">up_proj</text>
<line x1="537" y1="302" x2="537" y2="312" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
<line x1="622" y1="302" x2="622" y2="312" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>

<rect x="499" y="312" width="162" height="26" rx="6" fill="#fdf6f3" stroke="#993c1d" stroke-width="0.5"/>
<text x="580" y="325" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993c1d">silu &#8855; multiply</text>
<line x1="580" y1="338" x2="580" y2="348" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>

<rect x="499" y="348" width="162" height="26" rx="6" fill="#fdf6f3" stroke="#993c1d" stroke-width="0.5"/>
<text x="580" y="361" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993c1d">down_proj</text>

<!-- right lane: embedding dim + context length -->
<line x1="435" y1="536" x2="485" y2="536" stroke="#898781" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="495" y="523" font-size="11" fill="#5f5e5a">embedding dim</text>
<text x="495" y="539" font-size="13" font-weight="600" fill="#0b0b0b">{{n_embd}}</text>
<text x="495" y="556" font-size="11" fill="#5f5e5a">context length: {{n_ctx}} tokens</text>

<!-- left lane: q/k norm + rope theta, against attention box -->
<line x1="225" y1="405" x2="142" y2="405" stroke="#898781" stroke-width="0.5" stroke-dasharray="4 3"/>
<rect x="22" y="393" width="120" height="24" rx="12" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="82" y="405" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0f6e56">q/k norm</text>

<line x1="225" y1="435" x2="132" y2="435" stroke="#898781" stroke-width="0.5" stroke-dasharray="4 3"/>
<rect x="22" y="423" width="110" height="24" rx="6" fill="#fcfcfb" stroke="#c9c8c3" stroke-width="0.5"/>
<text x="77" y="435" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5f5e5a">rope &#183; theta</text>

</svg>
